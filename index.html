<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chúc mừng ngày đẻ 🎉</title>
  <meta name="description" content="Trang chúc mừng sinh nhật với hiệu ứng confetti, bóng bay và nền img.png" />
  <link rel="preload" as="image" href="img.png">
  <style>
    :root{
      --backdrop: rgba(0,0,0,.45);
      --card: rgba(255,255,255,.12);
      --card-border: rgba(255,255,255,.25);
      --text: #fff;
      --accent: #ffd54f;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text); overflow:hidden;
      background:#111;
    }

    /* Background Image */
    .bg::before{
      content:""; position:fixed; inset:0; z-index:-2;
      background:url('img.png') center/cover no-repeat fixed;
      filter: saturate(1.05) brightness(.85);
      transform: scale(1.02);
    }
    /* Soft overlay for readability */
    .bg::after{
      content:""; position:fixed; inset:0; z-index:-1;
      background: radial-gradient(100% 120% at 50% 0%, rgba(0,0,0,0.25), rgba(0,0,0,0.75)), linear-gradient(var(--backdrop), var(--backdrop));
      backdrop-filter: blur(2px);
    }

    /* Center Stage */
    .stage{
      position:relative; height:100%; width:100%; display:grid; place-items:center; padding:24px;
    }
    .card{
      width:min(820px, 92vw); padding:28px 28px 22px; border-radius:24px;
      background: var(--card); border:1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
      backdrop-filter: blur(6px) saturate(140%);
    }
    .title{
      margin:0 0 6px; font-weight:800; text-align:center; line-height:1.15;
      font-size: clamp(28px, 6vw, 54px);
      letter-spacing:.5px;
      text-shadow: 0 0 8px rgba(255,255,255,.35), 0 0 24px rgba(255,215,0,.25);
      animation: glow 2.5s ease-in-out infinite alternate;
    }
    @keyframes glow{
      from{ text-shadow: 0 0 6px rgba(255,255,255,.35), 0 0 14px rgba(255,215,0,.25);} 
      to{   text-shadow: 0 0 16px rgba(255,255,255,.55), 0 0 38px rgba(255,215,0,.45);} 
    }

    .subtitle{ text-align:center; opacity:.9; margin:0 0 12px; font-size: clamp(16px, 2.6vw, 20px); }

    .cta{
      margin-top:14px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    }
    .btn{
      appearance:none; border:none; cursor:pointer; padding:12px 18px; border-radius:999px; font-weight:700;
      color:#111; background:#ffdf6b; box-shadow: 0 8px 22px rgba(0,0,0,.25);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 10px 26px rgba(0,0,0,.32); }
    .btn:active{ transform: translateY(1px) scale(.99); }

    .btn-outline{
      color:var(--text); background:transparent; border:1px solid var(--card-border);
    }

    /* Floating emojis on the card header */
    .floaties{ position:absolute; inset:0; pointer-events:none; }
    .floaties span{
      position:absolute; font-size:22px; opacity:.85; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35));
      animation: drift var(--dur, 8s) linear infinite;
    }
    @keyframes drift{
      0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity: .1; }
      10%{ opacity:.85 }
      100%{ transform: translateY(-140px) translateX(var(--dx, 40px)) rotate(20deg); opacity:.05; }
    }

    /* Confetti Canvas */
    canvas#confetti{ position:fixed; inset:0; pointer-events:none; z-index:5; }

    /* Balloons */
    .balloon{ position:fixed; bottom:-160px; width:46px; height:60px; border-radius:50% 50% 48% 48%; 
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.6), rgba(255,255,255,0) 40%), var(--color, #f55); 
      box-shadow: inset -6px -10px 16px rgba(0,0,0,.2), 0 10px 30px rgba(0,0,0,.25); 
      transform: translateX(-50%);
      z-index: 3;
    }
    .balloon::after{ content:""; position:absolute; bottom:-16px; left:50%; width:2px; height:90px; background:rgba(255,255,255,.75); transform: translateX(-50%); opacity:.75 }
    @keyframes floatUp{
      0%{ transform: translate(-50%, 0) scale(1); opacity:0 }
      5%{ opacity:1 }
      100%{ transform: translate(-50%, -110vh) scale(1.05); opacity:.95 }
    }

    /* Footer note */
    .footer{ position:fixed; bottom:10px; right:12px; font-size:12px; opacity:.8 }

    /* Audio control */
    .audio{ display:flex; align-items:center; gap:8px; opacity:.95 }
    .audio input[type="range"]{ width:160px }

    /* Small screens */
    @media (max-width: 480px){
      .btn{ padding:10px 14px }
      .balloon{ width:40px; height:54px }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <canvas id="confetti"></canvas>

  <div class="stage">
    <section class="card">
      <div class="floaties" aria-hidden="true"></div>
      <h1 class="title">🎉 Chúc mừng <span id="name">ngày đẻ của Khang Trần</span> 🎂</h1>
      <p class="subtitle" id="tagline">Chúc bạn một tuổi mới tràn đầy niềm vui, sức khỏe và may mắn! ✨</p>

      <div class="cta">
        <button class="btn" id="partyBtn">Bắt đầu tiệc!</button>
        <button class="btn btn-outline" id="balloonBtn">Thả bóng bay</button>
        <button class="btn btn-outline" id="confettiBtn">Bắn confetti</button>
      </div>

      <div class="cta" style="margin-top:10px">
        <div class="audio">
          <button class="btn btn-outline" id="musicBtn" title="Phát/Ngừng nhạc">🎵 Nhạc</button>
          <label for="vol" style="font-size:12px">Âm lượng</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>
    </section>
  </div>

  <div class="footer">Bấm "Bắt đầu tiệc!" để kích hoạt hiệu ứng 🎈</div>

  <audio id="music" preload="auto">
    <source src="" type="audio/mpeg">
  </audio>

<script>
(function(){
  const nameEl = document.getElementById('name');
  const taglineEl = document.getElementById('tagline');
  const partyBtn = document.getElementById('partyBtn');
  const confettiBtn = document.getElementById('confettiBtn');
  const balloonBtn = document.getElementById('balloonBtn');
  const musicBtn = document.getElementById('musicBtn');
  const vol = document.getElementById('vol');
  const music = document.getElementById('music');

  // You can set your mp3 URL here (optional)
  // music.src = 'happy-birthday.mp3';

  // Subtle typewriter effect for the tagline
  const fullText = taglineEl.textContent;
  taglineEl.textContent = '';
  let i = 0; const type = () => { if(i <= fullText.length){ taglineEl.textContent = fullText.slice(0,i++); requestAnimationFrame(type);} }; type();

  // Floaty emojis inside card
  const floaties = document.querySelector('.floaties');
  const emojis = ['🎈','🎉','✨','💫','🎊','🪅'];
  for(let k=0;k<14;k++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.bottom = (Math.random()*40) + 'px';
    s.style.setProperty('--dx', (Math.random()*120-60)+'px');
    s.style.setProperty('--dur', (6 + Math.random()*6) + 's');
    floaties.appendChild(s);
  }

  // Confetti setup
  const confettiCanvas = document.getElementById('confetti');
  const ctx = confettiCanvas.getContext('2d');
  let W, H; const resize = () => { W = confettiCanvas.width = innerWidth; H = confettiCanvas.height = innerHeight; }; resize();
  addEventListener('resize', resize);

  const COLORS = ['#f94144','#f3722c','#f9c74f','#90be6d','#43aa8b','#577590','#ff6b6b','#ffd166','#06d6a0','#4cc9f0'];
  let pieces = [];
  function spawnConfetti(count=140, burstX=W/2, burstY=H/3){
    for(let i=0;i<count;i++){
      pieces.push({
        x: burstX + (Math.random()*80-40), y: burstY + (Math.random()*40-20),
        w: 6 + Math.random()*6, h: 10 + Math.random()*12,
        color: COLORS[Math.random()*COLORS.length|0],
        vx: (Math.random()*6 - 3), vy: (Math.random()*-6 - 4),
        rot: Math.random()*Math.PI, vr: Math.random()*0.2 - 0.1,
        life: 0, maxLife: 240 + Math.random()*120
      });
    }
  }

  function tick(){
    ctx.clearRect(0,0,W,H);
    pieces.forEach(p=>{
      p.vy += 0.08; // gravity
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      if(p.y > H + 40) p.life = p.maxLife; // offscreen
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    pieces = pieces.filter(p=>p.life < p.maxLife);
    requestAnimationFrame(tick);
  }
  tick();

  function randomX(){ return 30 + Math.random()*(innerWidth-60); }
  function randomColor(){ return COLORS[Math.random()*COLORS.length|0]; }

  function spawnBalloon(){
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = randomX() + 'px';
    b.style.setProperty('--color', randomColor());
    const dur = 8 + Math.random()*8;
    b.style.animation = `floatUp ${dur}s linear forwards`;
    document.body.appendChild(b);
    b.addEventListener('animationend', ()=> b.remove());
  }

  // Button actions
  partyBtn.addEventListener('click', ()=>{
    spawnConfetti(220, W/2, H*0.65);
    for(let n=0;n<14;n++) setTimeout(spawnBalloon, n*180);
    try{ music.play(); }catch(e){}
  });
  confettiBtn.addEventListener('click', ()=> spawnConfetti(160, W*Math.random(), H*(.35+.4*Math.random())));
  balloonBtn.addEventListener('click', ()=>{ for(let n=0;n<10;n++) setTimeout(spawnBalloon, n*160); });

  // Music controls
  musicBtn.addEventListener('click', ()=>{
    if(!music.src){
      alert('Mẹo: đặt file \'happy-birthday.mp3\' cùng thư mục hoặc chỉnh music.src trong script.');
      return;
    }
    if(music.paused) music.play(); else music.pause();
  });
  vol.addEventListener('input', ()=> music.volume = +vol.value);

  // Accessibility: space/enter to fire party
  addEventListener('keydown', (e)=>{
    if(e.code==='Space' || e.key==='Enter'){ partyBtn.click(); }
  });
})();
</script>
</body>
</html>
